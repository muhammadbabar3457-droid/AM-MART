plugins { id 'com.android.application' }

android {
    namespace 'com.aimantraders.ammart'
    compileSdk 36

    defaultConfig {
        applicationId 'com.aimantraders.ammart'
        minSdk 23
        targetSdk 36
        versionCode 2
        versionName '1.0.1'
    }

    buildTypes {
        release {
            minifyEnabled false
